name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: modern
    env:
      APP_SECRET: ci-only-not-for-production
      DB_PASSWORD: ci-only-not-for-production
      DB_ROOT_PASSWORD: ci-root-only-not-for-production
      SITE_BASE_URL: https://jsn.soohwalee.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modern/package-lock.json

      - name: Validate frontend lockfile and audit dependencies
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run build

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build immutable application images
        run: docker compose build app web test

      - name: Validate Composer metadata and audit dependencies
        run: |
          docker compose run --rm --no-deps test composer validate --strict
          docker compose run --rm --no-deps test composer audit --locked

      - name: Create and validate a fresh database
        run: |
          docker compose up -d db
          docker compose run --rm app php bin/console doctrine:migrations:migrate --no-interaction
          docker compose run --rm app php bin/console doctrine:schema:validate

      - name: Run static framework checks
        run: |
          docker compose run --rm app php bin/console lint:container
          docker compose run --rm app php bin/console lint:twig templates

      - name: Run dataset-independent tests
        run: docker compose run --rm test php bin/phpunit --exclude-group integration

      - name: Verify container health endpoints
        run: |
          docker compose up -d --wait --wait-timeout 120 app web
          docker compose exec -T web wget --quiet --spider http://127.0.0.1/healthz
          docker compose exec -T web wget --quiet --spider http://127.0.0.1/readyz

      - name: Clean up
        if: always()
        run: docker compose down --volumes --remove-orphans
